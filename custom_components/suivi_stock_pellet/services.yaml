log_consumption:
  name: Enregistrer une consommation
  description: Ajoute une entrée de consommation de granulés au journal. La saison est déterminée automatiquement à partir de la date (celle du jour par défaut, ou celle fournie), sauf si une saison est précisée explicitement.
  fields:
    qty_bags:
      name: Nombre de sacs
      description: Nombre de sacs consommés.
      required: true
      default: 1
      selector:
        number:
          min: 0.1
          max: 100
          step: 0.1
          mode: box
    date:
      name: Date
      description: Date de la consommation (par défaut aujourd'hui).
      required: false
      selector:
        date: {}
    season:
      name: Saison
      description: Force la saison de destination, au format AAAA-AAAA (ex. 2024-2025), si elle doit différer de celle déduite de la date (facultatif).
      required: false
      example: "2024-2025"
      selector:
        text: {}

log_purchase:
  name: Enregistrer un achat
  description: Ajoute une entrée d'achat de granulés au journal. La saison est déterminée automatiquement à partir de la date (celle du jour par défaut, ou celle fournie), sauf si une saison est précisée explicitement — utile pour un achat fait en avance pour la saison suivante (ex. achat en juin pour l'hiver qui commence en septembre).
  fields:
    qty_bags:
      name: Nombre de sacs
      description: Nombre de sacs achetés.
      required: true
      selector:
        number:
          min: 0.1
          max: 1000
          step: 0.1
          mode: box
    price_eur:
      name: Prix total
      description: Prix total de l'achat en euros (facultatif).
      required: false
      selector:
        number:
          min: 0
          max: 10000
          step: 0.01
          mode: box
    date:
      name: Date
      description: Date de l'achat (par défaut aujourd'hui).
      required: false
      selector:
        date: {}
    season:
      name: Saison
      description: Force la saison de destination, au format AAAA-AAAA (ex. 2024-2025), si elle doit différer de celle déduite de la date (facultatif).
      required: false
      example: "2024-2025"
      selector:
        text: {}

undo_last_entry:
  name: Annuler la dernière saisie
  description: Annule la dernière entrée (achat ou consommation) de la saison en cours (ou d'une saison précisée).
  fields:
    season:
      name: Saison
      description: Saison à corriger, au format AAAA-AAAA (ex. 2024-2025). Par défaut, la saison en cours.
      required: false
      example: "2024-2025"
      selector:
        text: {}

edit_entry:
  name: Modifier une saisie
  description: Modifie une entree existante (achat ou consommation) du journal d'une saison.
  fields:
    season:
      name: Saison
      description: Saison contenant la saisie a modifier, au format AAAA-AAAA (ex. 2024-2025).
      required: true
      example: "2024-2025"
      selector:
        text: {}
    index:
      name: Index
      description: Position de la saisie dans le journal de la saison (0 = la plus ancienne).
      required: true
      selector:
        number:
          min: 0
          max: 10000
          mode: box
    qty_bags:
      name: Nombre de sacs
      description: Nouvelle quantite de sacs (facultatif, inchangee si absente).
      required: false
      selector:
        number:
          min: 0.1
          max: 1000
          step: 0.1
          mode: box
    price_eur:
      name: Prix total
      description: Nouveau prix total en euros, uniquement pour un achat (facultatif, inchange si absent).
      required: false
      selector:
        number:
          min: 0
          max: 10000
          step: 0.01
          mode: box
    date:
      name: Date
      description: Nouvelle date de la saisie (facultatif, inchangee si absente).
      required: false
      selector:
        date: {}
    new_season:
      name: Nouvelle saison
      description: Deplace deliberement la saisie vers cette saison, au format AAAA-AAAA (facultatif, sinon la saisie reste dans sa saison actuelle meme si la date change).
      required: false
      example: "2026-2027"
      selector:
        text: {}

delete_entry:
  name: Supprimer une saisie
  description: Supprime definitivement une entree (achat ou consommation) du journal d'une saison.
  fields:
    season:
      name: Saison
      description: Saison contenant la saisie a supprimer, au format AAAA-AAAA (ex. 2024-2025).
      required: true
      example: "2024-2025"
      selector:
        text: {}
    index:
      name: Index
      description: Position de la saisie dans le journal de la saison (0 = la plus ancienne).
      required: true
      selector:
        number:
          min: 0
          max: 10000
          mode: box

set_stock_initial:
  name: Definir le stock initial
  description: Definit ou corrige le stock de depart (en sacs) d'une saison, par exemple pour reprendre un stock existant lors du passage a une nouvelle saison ou apres un comptage physique.
  fields:
    season:
      name: Saison
      description: Saison a corriger, au format AAAA-AAAA (ex. 2024-2025).
      required: true
      example: "2024-2025"
      selector:
        text: {}
    stock_initial_bags:
      name: Stock initial (sacs)
      description: Nombre de sacs presents au debut de la saison, avant tout achat ou consommation enregistre dans cette saison.
      required: true
      selector:
        number:
          min: 0
          max: 10000
          mode: box
